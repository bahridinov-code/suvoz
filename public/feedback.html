<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suvoz – Send feedback</title>
<script>(function(){try{var d=document.documentElement,l=localStorage.getItem("lang");if(l&&/^(en|ar|ru|tg|uz)$/.test(l)){d.lang=l;d.dir=l==="ar"?"rtl":"ltr"}var s=JSON.parse(localStorage.getItem("suvoz_session")||"null");d.className+=(s&&s.access_token?" in pre":" out")}catch(e){}})()</script>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Suvoz">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3b3fe0"/><g stroke-linecap="round" stroke-width="3.2"><path d="M9 13v6" stroke="#fff"/><path d="M14.5 8v16" stroke="#fff"/><path d="M20 11v10" stroke="#7fe3dd"/><path d="M25 14.5v3" stroke="#7fe3dd"/></g></svg>
      <span data-brand>Suvoz</span>
    </a>
    <div class="top-right">
      <span id="who" class="who-mail" dir="ltr" hidden></span>
      <a class="pbtn" href="/app" data-i18n="nav.tools"></a>
      <button id="logout" class="pbtn" type="button" hidden data-i18n="app.logout"></button>
    </div>
  </div>
</header>

<main class="wrap plans-page fb-page">
  <h1 data-i18n="fb.title"></h1>
  <p class="lead" data-i18n="fb.sub"></p>
  <form id="form" class="panel fb-form" novalidate>
    <div class="fb-kinds" role="radiogroup">
      <label class="fb-kind"><input type="radio" name="kind" value="bug" checked><span data-i18n="fb.bug"></span></label>
      <label class="fb-kind"><input type="radio" name="kind" value="idea"><span data-i18n="fb.idea"></span></label>
      <label class="fb-kind"><input type="radio" name="kind" value="question"><span data-i18n="fb.question"></span></label>
      <label class="fb-kind"><input type="radio" name="kind" value="other"><span data-i18n="fb.other"></span></label>
    </div>
    <label class="fb-label" for="msg" data-i18n="fb.label"></label>
    <textarea id="msg" class="field" rows="7" maxlength="3000" dir="auto" data-i18n-ph="fb.ph"></textarea>
    <p class="meta" id="reply"></p>
    <p id="status" class="amsg" role="status"></p>
    <button id="send" class="btn" type="submit" data-i18n="fb.send"></button>
  </form>
  <div id="thanks" class="panel fb-thanks" hidden>
    <div class="fb-check" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 data-i18n="fb.thanks.t"></h2>
    <p id="thanksD"></p>
    <button id="again" class="pbtn" type="button" data-i18n="fb.again"></button>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/i18n-auth.js"></script>
<script src="/i18n-pricing.js"></script>
<script src="/i18n-feedback.js"></script>
<script src="/i18n-hub.js"></script>
<script src="/i18n-busy.js"></script>
<script src="/busy.js"></script>
<script src="/auth.js"></script>
<script src="/profile.js"></script>
<script src="/feedback.js"></script>
</body>
</html>

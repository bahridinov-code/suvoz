<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suvoz – Voice design</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Suvoz">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3b3fe0"/><g stroke-linecap="round" stroke-width="3.2"><path d="M9 13v6" stroke="#fff"/><path d="M14.5 8v16" stroke="#fff"/><path d="M20 11v10" stroke="#7fe3dd"/><path d="M25 14.5v3" stroke="#7fe3dd"/></g></svg>
      <span data-brand>Suvoz</span>
    </a>
    <div class="top-right">
      <span id="who" class="who-mail" dir="ltr" hidden></span>
      <a class="pbtn" href="/app" data-i18n="nav.tools"></a>
      <button id="logout" class="pbtn" type="button" hidden data-i18n="app.logout"></button>
    </div>
  </div>
</header>

<main class="app">
  <h1 data-i18n="vd.title"></h1>
  <p class="lead" data-i18n="vd.sub" data-hl></p>
  <div id="trial" class="pill" hidden></div>

  <div class="panel" id="paidBox" hidden>
    <p data-i18n="vd.paid"></p>
    <a class="pbtn" href="/plans" data-i18n="app.plans"></a>
  </div>

  <div id="designBox" hidden>
    <div class="panel">
      <textarea id="desc" class="field vd-desc" dir="auto" maxlength="500" spellcheck="false" data-i18n-ph="vd.ph"></textarea>
      <div class="meta"><span id="dcount">0</span> / 500 · <span data-i18n="vd.cost" id="costNote"></span></div>
      <div class="chips" id="chips"></div>
    </div>
    <button id="go" class="btn" disabled data-i18n="vd.go"></button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>

  <div id="previews" class="panel" hidden>
    <h3 data-i18n="vd.pick"></h3>
    <div id="plist"></div>
  </div>

  <div id="mineBox" class="panel" hidden>
    <h3 id="mineTitle"></h3>
    <div id="mlist"></div>
    <p class="meta"><a href="/dialogue" data-i18n="vd.use"></a></p>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/i18n-auth.js"></script>
<script src="/i18n-pricing.js"></script>
<script src="/i18n-history.js"></script>
<script src="/i18n-voice.js"></script>
<script src="/i18n-hub.js"></script>
<script src="/hl.js"></script>
<script src="/auth.js"></script>
<script src="/profile.js"></script>
<script src="/voicedesign.js"></script>
</body>
</html>

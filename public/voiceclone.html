<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suvoz – Voice cloning</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Suvoz">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3b3fe0"/><g stroke-linecap="round" stroke-width="3.2"><path d="M9 13v6" stroke="#fff"/><path d="M14.5 8v16" stroke="#fff"/><path d="M20 11v10" stroke="#7fe3dd"/><path d="M25 14.5v3" stroke="#7fe3dd"/></g></svg>
      <span data-brand>Suvoz</span>
    </a>
    <div class="top-right">
      <span id="who" class="who-mail" dir="ltr" hidden></span>
      <a class="pbtn" href="/app" data-i18n="nav.tools"></a>
      <button id="logout" class="pbtn" type="button" hidden data-i18n="app.logout"></button>
    </div>
  </div>
</header>

<main class="app">
  <h1 data-i18n="vc.title"></h1>
  <p class="lead" data-i18n="vc.sub" data-hl></p>
  <div id="trial" class="pill" hidden></div>

  <div class="panel" id="paidBox" hidden>
    <p data-i18n="vd.paid"></p>
    <a class="pbtn" href="/plans" data-i18n="app.plans"></a>
  </div>

  <div id="cloneBox" hidden>
    <p class="own" data-i18n="vc.own"></p>
    <div class="panel">
      <input id="file" type="file" accept="audio/*,video/*" hidden>
      <div class="src"><button id="pick" class="srcbtn" type="button"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span data-i18n="vc.pick"></span></button></div>
      <div class="meta" id="fileInfo" dir="auto"></div>
      <p class="meta" data-i18n="vc.tips" data-hl></p>
      <input id="vname" class="field" maxlength="40" dir="auto" data-i18n-ph="vd.name">
      <label class="consent"><input id="consent" type="checkbox"> <span data-i18n="vc.consent"></span></label>
    </div>
    <button id="go" class="btn" disabled data-i18n="vc.go"></button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>

  <div id="mineBox" class="panel" hidden>
    <h3 id="mineTitle"></h3>
    <div id="mlist"></div>
    <p class="meta"><a href="/dialogue" data-i18n="vd.use"></a></p>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/i18n-auth.js"></script>
<script src="/i18n-pricing.js"></script>
<script src="/i18n-history.js"></script>
<script src="/i18n-voice.js"></script>
<script src="/i18n-rec.js"></script>
<script src="/i18n-hub.js"></script>
<script src="/hl.js"></script>
<script src="/i18n-busy.js"></script>
<script src="/busy.js"></script>
<script src="/auth.js"></script>
<script src="/profile.js"></script>
<script src="/recorder.js"></script>
<script src="/voiceclone.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suvoz – AI subtitles</title>
<script>(function(){try{var d=document.documentElement,l=localStorage.getItem("lang");if(l&&/^(en|ar|ru|tg|uz)$/.test(l)){d.lang=l;d.dir=l==="ar"?"rtl":"ltr"}var s=JSON.parse(localStorage.getItem("suvoz_session")||"null");d.className+=(s&&s.access_token?" in pre":" out")}catch(e){}})()</script>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Suvoz">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3b3fe0"/><g stroke-linecap="round" stroke-width="3.2"><path d="M9 13v6" stroke="#fff"/><path d="M14.5 8v16" stroke="#fff"/><path d="M20 11v10" stroke="#7fe3dd"/><path d="M25 14.5v3" stroke="#7fe3dd"/></g></svg>
      <span data-brand>Suvoz</span>
    </a>
    <div class="top-right">
      <span id="who" class="who-mail" dir="ltr" hidden></span>
      <a class="pbtn" href="/app" data-i18n="nav.tools"></a>
      <button id="logout" class="pbtn" type="button" hidden data-i18n="app.logout"></button>
    </div>
  </div>
</header>

<main class="app subs">
  <h1 data-i18n="subs.title"></h1>
  <p class="lead" data-i18n="subs.sub" data-hl></p>
  <div id="trial" class="pill" hidden></div>

  <section id="step1">
    <div class="panel">
      <input id="file" type="file" accept="video/*" hidden>
      <div class="src one"><button id="pick" class="srcbtn" type="button"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z"/></svg><span data-i18n="subs.pick"></span><small class="meta" data-i18n="subs.limits"></small></button></div>
      <div class="meta" id="fileInfo" dir="auto"></div>
      <label class="subs-lang"><span data-i18n="subs.lang"></span>
        <select id="lang" class="field"></select>
      </label>
    </div>
    <button id="go" class="btn" disabled data-i18n="subs.go"></button>
  </section>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="bar" class="subs-bar" hidden><i></i></div>

  <section id="step2" class="subs-edit" hidden>
    <div class="subs-stage">
      <div id="frame" class="subs-frame">
        <video id="video" playsinline controls preload="auto"></video>
        <canvas id="overlay" aria-hidden="true"></canvas>
      </div>
      <p id="wmNote" class="meta" hidden data-i18n="subs.wm"></p>
    </div>
    <div class="subs-side">
      <div class="subs-tabs" role="tablist">
        <button type="button" class="on" data-tab="style" role="tab" data-i18n="subs.tab.style"></button>
        <button type="button" data-tab="text" role="tab" data-i18n="subs.tab.text"></button>
      </div>
      <div id="tabStyle">
        <div id="mySection" hidden>
          <h4 class="subs-h" data-i18n="subs.my"></h4>
          <div id="myTpls" class="tpls"></div>
          <h4 class="subs-h" data-i18n="subs.ready"></h4>
        </div>
        <div id="tpls" class="tpls"></div>
        <div class="subs-mk">
          <button id="makeStyle" class="pbtn" type="button" data-i18n="subs.make"></button>
          <button id="editStyle" class="pbtn" type="button" hidden data-i18n="subs.edit"></button>
        </div>
        <div class="subs-opt">
          <span data-i18n="subs.pos"></span>
          <div class="seg" id="posSeg">
            <button type="button" data-pos="0.18" data-i18n="subs.pos.top"></button>
            <button type="button" data-pos="0.5" data-i18n="subs.pos.mid"></button>
            <button type="button" data-pos="0.72" data-i18n="subs.pos.bot"></button>
          </div>
          <input id="pos" type="range" min="0.08" max="0.92" step="0.01" value="0.72" aria-labelledby="posSeg">
        </div>
        <div class="subs-opt">
          <label for="size" data-i18n="subs.size"></label>
          <input id="size" type="range" min="0.6" max="1.6" step="0.05" value="1">
        </div>
        <div class="subs-opt row">
          <label class="chk"><input id="upper" type="checkbox"> <span data-i18n="subs.upper"></span></label>
          <label class="chk colour"><span data-i18n="subs.color"></span> <input id="color" type="color" value="#FFE600"></label>
          <button id="colorReset" class="linkbtn" type="button" data-i18n="subs.color.reset"></button>
        </div>
      </div>
      <div id="tabEdit" class="subs-ed" hidden>
        <h3 data-i18n="subs.ed.title"></h3>
        <div id="aiBox" class="subs-ai" hidden>
          <div id="linkRow" class="subs-link" hidden>
            <input id="aiLink" class="field" type="url" inputmode="url" dir="ltr" data-i18n-ph="subs.link.ph">
            <button id="aiLinkGo" class="btn" type="button" data-i18n="subs.link.go"></button>
          </div>
          <input id="aiFile" type="file" accept="image/*,video/*" hidden>
          <button id="aiPick" class="srcbtn" type="button"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9l-4.7 1.8L12 15.5l-1.8-4.7L5.5 9l4.7-1.3z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg><span data-i18n="subs.ai.pick"></span><small class="meta" data-i18n="subs.ai.help"></small></button>
        </div>
        <label class="subs-opt"><span data-i18n="subs.ed.name"></span><input id="edName" class="field" maxlength="40" dir="auto"></label>
        <div class="subs-two">
          <label class="subs-opt"><span data-i18n="subs.ed.anim"></span><select id="edBase" class="field"></select></label>
          <label class="subs-opt"><span data-i18n="subs.ed.font"></span><select id="edFont" class="field"></select></label>
        </div>
        <div class="subs-two">
          <label class="subs-opt"><span data-i18n="subs.ed.weight"></span><select id="edWeight" class="field"></select></label>
          <label class="subs-opt"><span><span data-i18n="subs.ed.words"></span> <b id="edWordsN"></b></span><input id="edWords" type="range" min="1" max="8" step="1"></label>
        </div>
        <label class="chk subs-opt row"><input id="edUpper" type="checkbox"> <span data-i18n="subs.upper"></span></label>
        <div class="subs-opt"><span data-i18n="subs.ed.colors"></span>
          <div class="subs-colors">
            <label><input id="edText" type="color"><span data-i18n="subs.ed.text"></span></label>
            <label><input id="edAccent" type="color"><span data-i18n="subs.ed.accent"></span></label>
            <label><input id="edOutline" type="color"><span data-i18n="subs.ed.outline"></span></label>
            <label><input id="edBg" type="color"><span data-i18n="subs.ed.bg"></span></label>
          </div>
        </div>
        <label class="subs-opt"><span data-i18n="subs.ed.outlineW"></span><input id="edOutlineW" type="range" min="0" max="0.3" step="0.01"></label>
        <label class="subs-opt"><span data-i18n="subs.ed.shadow"></span><input id="edShadow" type="range" min="0" max="1" step="0.05"></label>
        <label class="subs-opt"><span data-i18n="subs.ed.bgA"></span><input id="edBgA" type="range" min="0" max="1" step="0.05"></label>
        <label class="subs-opt"><span data-i18n="subs.ed.scale"></span><input id="edScale" type="range" min="0.5" max="2" step="0.05"></label>
        <p id="edNote" class="subs-note" hidden><span id="edNoteText"></span> <a id="edPlans" href="/plans" hidden data-i18n="subs.ed.plans"></a></p>
        <div class="subs-actions">
          <button id="edSave" class="btn" type="button" data-i18n="subs.ed.save"></button>
          <button id="edCancel" class="pbtn" type="button" data-i18n="subs.ed.cancel"></button>
          <button id="edDelete" class="linkbtn danger" type="button" hidden data-i18n="subs.ed.delete"></button>
        </div>
      </div>
      <div id="tabText" hidden>
        <p class="meta" data-i18n="subs.text.help"></p>
        <div id="lines" class="subs-lines"></div>
      </div>
      <div id="mainActions" class="subs-actions">
        <button id="export" class="btn" type="button" data-i18n="subs.export"></button>
        <button id="srt" class="pbtn" type="button" data-i18n="subs.srt"></button>
        <button id="again" class="pbtn" type="button" data-i18n="subs.new"></button>
      </div>
      <button id="cancel" class="pbtn" type="button" hidden data-i18n="subs.cancel"></button>
    </div>
  </section>
</main>

<script src="/i18n.js"></script>
<script src="/i18n-auth.js"></script>
<script src="/i18n-pricing.js"></script>
<script src="/i18n-history.js"></script>
<script src="/i18n-stt.js"></script>
<script src="/i18n-hub.js"></script>
<script src="/i18n-subs.js"></script>
<script src="/hl.js"></script>
<script src="/i18n-busy.js"></script>
<script src="/busy.js"></script>
<script src="/auth.js"></script>
<script src="/profile.js"></script>
<script src="/mp4mux.js"></script>
<script src="/captions.js"></script>
<script src="/subexport.js"></script>
<script src="/subtitles.js"></script>
</body>
</html>

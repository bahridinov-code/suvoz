<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suvoz – Log in</title>
<script>(function(){try{var d=document.documentElement,l=localStorage.getItem("lang");if(l&&/^(en|ar|ru|tg|uz)$/.test(l)){d.lang=l;d.dir=l==="ar"?"rtl":"ltr"}var s=JSON.parse(localStorage.getItem("suvoz_session")||"null");d.className+=(s&&s.access_token?" in pre":" out")}catch(e){}})()</script>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Suvoz">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3b3fe0"/><g stroke-linecap="round" stroke-width="3.2"><path d="M9 13v6" stroke="#fff"/><path d="M14.5 8v16" stroke="#fff"/><path d="M20 11v10" stroke="#7fe3dd"/><path d="M25 14.5v3" stroke="#7fe3dd"/></g></svg>
      <span data-brand>Suvoz</span>
    </a>
    <div class="top-right"><select id="langSel" class="lang" aria-label="Language"></select></div>
  </div>
</header>

<main class="auth">
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" id="tabSignup" role="tab" data-i18n="auth.tab.signup"></button>
    <button type="button" id="tabLogin" role="tab" data-i18n="auth.tab.login"></button>
  </div>
  <h1 id="title"></h1>
  <p class="lead" id="sub"></p>

  <button id="google" class="gbtn" type="button">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.2A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
    <span data-i18n="auth.google"></span>
  </button>
  <div id="or" class="or"><span data-i18n="auth.or"></span></div>

  <form id="form" class="stack" novalidate>
    <label id="emailBox"><span data-i18n="auth.email"></span>
      <input id="email" class="field" type="email" autocomplete="email" inputmode="email" dir="ltr">
    </label>
    <label id="passBox"><span data-i18n="auth.password"></span>
      <input id="pass" class="field" type="password" dir="ltr">
      <small id="hint" class="meta" data-i18n="auth.password.hint"></small>
    </label>
    <label id="codeBox"><span data-i18n="auth.code.label"></span>
      <input id="otp" class="field otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" dir="ltr">
    </label>
    <button id="submit" class="btn" type="submit"></button>
    <button id="codeLink" class="linkbtn" type="button" data-i18n="auth.code.link"></button>
    <button id="resend" class="linkbtn" type="button" data-i18n="auth.code.resend"></button>
    <button id="forgot" class="linkbtn" type="button" data-i18n="auth.forgot"></button>
    <button id="back" class="linkbtn" type="button" data-i18n="auth.back"></button>
  </form>

  <div id="msg" class="amsg" role="status" aria-live="polite"></div>
</main>

<script src="/i18n.js"></script>
<script src="/i18n-auth.js"></script>
<script src="/auth.js"></script>
<script src="/login.js"></script>
</body>
</html>

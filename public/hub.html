<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suvoz</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Suvoz">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3b3fe0"/><g stroke-linecap="round" stroke-width="3.2"><path d="M9 13v6" stroke="#fff"/><path d="M14.5 8v16" stroke="#fff"/><path d="M20 11v10" stroke="#7fe3dd"/><path d="M25 14.5v3" stroke="#7fe3dd"/></g></svg>
      <span data-brand>Suvoz</span>
    </a>
    <div class="top-right">
      <span id="who" class="who-mail" dir="ltr" hidden></span>
      <select id="langSel" class="lang" aria-label="Language"></select>
      <a id="historyLink" class="pbtn" href="/history" hidden data-i18n="hist.nav"></a>
      <a id="plansLink" class="pbtn" href="/#pricing" data-i18n="app.plans"></a>
      <button id="logout" class="pbtn" type="button" hidden data-i18n="app.logout"></button>
    </div>
  </div>
</header>

<main class="app hub">
  <h1 data-i18n="hub.title"></h1>
  <div id="trial" class="pill" hidden></div>
  <div id="tiles" class="tiles"></div>
  <p class="meta hub-note" data-i18n="hub.note"></p>
  <p class="meta acct-link"><a href="/account" data-i18n="acct.title"></a></p>
</main>

<script src="/i18n.js"></script>
<script src="/i18n-auth.js"></script>
<script src="/i18n-pricing.js"></script>
<script src="/i18n-history.js"></script>
<script src="/i18n-hub.js"></script>
<script src="/i18n-account.js"></script>
<script src="/auth.js"></script>
<script src="/hub.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suvoz – Speech to text</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Suvoz">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3b3fe0"/><g stroke-linecap="round" stroke-width="3.2"><path d="M9 13v6" stroke="#fff"/><path d="M14.5 8v16" stroke="#fff"/><path d="M20 11v10" stroke="#7fe3dd"/><path d="M25 14.5v3" stroke="#7fe3dd"/></g></svg>
      <span data-brand>Suvoz</span>
    </a>
    <div class="top-right">
      <span id="who" class="who-mail" dir="ltr" hidden></span>
      <select id="langSel" class="lang" aria-label="Language"></select>
      <a class="pbtn" href="/app" data-i18n="nav.tools"></a>
      <button id="logout" class="pbtn" type="button" hidden data-i18n="app.logout"></button>
    </div>
  </div>
</header>

<main class="app">
  <h1 data-i18n="stt.title"></h1>
  <p class="lead" data-i18n="stt.sub"></p>
  <div id="trial" class="pill" hidden></div>

  <div class="panel">
    <input id="file" type="file" accept="audio/*,video/*" hidden>
    <button id="pick" class="pbtn" type="button" data-i18n="stt.pick"></button>
    <div class="meta" id="fileInfo" dir="auto"></div>
  </div>

  <button id="go" class="btn" disabled data-i18n="stt.go"></button>
  <div id="status" role="status" aria-live="polite"></div>

  <div id="result" class="panel" hidden>
    <h3 data-i18n="stt.result"></h3>
    <textarea id="out" class="field" dir="auto" spellcheck="false"></textarea>
    <div class="hact">
      <button id="copy" class="pbtn" type="button" data-i18n="stt.copy"></button>
      <button id="save" class="pbtn" type="button" data-i18n="stt.download"></button>
      <button id="use" class="pbtn" type="button" data-i18n="stt.use"></button>
      <button id="tr" class="pbtn" type="button" hidden data-i18n="stt.translate"></button>
    </div>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/i18n-auth.js"></script>
<script src="/i18n-pricing.js"></script>
<script src="/i18n-history.js"></script>
<script src="/i18n-stt.js"></script>
<script src="/i18n-translate.js"></script>
<script src="/i18n-hub.js"></script>
<script src="/auth.js"></script>
<script src="/transcribe.js"></script>
</body>
</html>

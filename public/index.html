<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suvoz – Turn a script into a conversation</title>
<meta name="description" content="Write a script, pick a voice for each speaker, and download one finished audio file in over 90 languages.">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Suvoz">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3b3fe0"/><g stroke-linecap="round" stroke-width="3.2"><path d="M9 13v6" stroke="#fff"/><path d="M14.5 8v16" stroke="#fff"/><path d="M20 11v10" stroke="#7fe3dd"/><path d="M25 14.5v3" stroke="#7fe3dd"/></g></svg>
      <span data-brand>Suvoz</span>
    </a>
    <nav class="nav">
      <a href="#how" data-i18n="nav.how"></a>
      <a href="#features" data-i18n="nav.features"></a>
      <a href="#languages" data-i18n="nav.languages"></a>
      <a href="#pricing" data-i18n="nav.pricing"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="top-right">
      <select id="langSel" class="lang" aria-label="Language"></select>
      <a class="login" href="/login?mode=login" data-i18n="nav.login"></a>
      <a class="btn small" href="/app" data-i18n="nav.try"></a>
    </div>
  </div>
</header>

<main>
  <div class="hero wrap">
    <h1 data-i18n="hero.title"></h1>
    <p data-i18n="hero.sub"></p>
    <div class="cta">
      <a class="btn" href="/app" data-i18n="hero.cta1"></a>
      <a class="btn ghost" href="#how" data-i18n="hero.cta2"></a>
    </div>
  </div>

  <div class="demo" aria-hidden="true">
    <div class="demo-script">
      <div class="demo-cap" data-i18n="demo.label"></div>
      <div class="turn a"><span class="who"><i></i><span data-i18n="demo.s1"></span></span><span data-i18n="demo.t1"></span></div>
      <div class="turn b"><span class="who"><i></i><span data-i18n="demo.s2"></span></span><span data-i18n="demo.t2"></span></div>
      <div class="turn a"><span class="who"><i></i><span data-i18n="demo.s3"></span></span><span data-i18n="demo.t3"></span></div>
    </div>
    <div class="demo-wave">
      <div class="demo-cap" data-i18n="demo.out"></div>
      <div class="wave" id="wave"></div>
    </div>
  </div>

  <section id="how" class="wrap">
    <h2 data-i18n="how.title"></h2>
    <div class="steps">
      <div class="step"><b>1</b><h3 data-i18n="how.1.t"></h3><p data-i18n="how.1.d"></p></div>
      <div class="step"><b>2</b><h3 data-i18n="how.2.t"></h3><p data-i18n="how.2.d"></p></div>
      <div class="step"><b>3</b><h3 data-i18n="how.3.t"></h3><p data-i18n="how.3.d"></p></div>
    </div>
  </section>

  <section id="features" class="wrap">
    <h2 data-i18n="feat.title"></h2>
    <div class="feats">
      <div class="feat"><h3 data-i18n="feat.1.t"></h3><p data-i18n="feat.1.d"></p></div>
      <div class="feat"><h3 data-i18n="feat.2.t"></h3><p data-i18n="feat.2.d"></p></div>
      <div class="feat"><h3 data-i18n="feat.3.t"></h3><p data-i18n="feat.3.d"></p></div>
      <div class="feat"><h3 data-i18n="feat.4.t"></h3><p data-i18n="feat.4.d"></p></div>
    </div>
  </section>

  <section id="languages" class="wrap">
    <h2 data-i18n="lang.title"></h2>
    <div class="langs">
      <span lang="en" dir="ltr">English</span>
      <span lang="ar" dir="rtl">العربية</span>
      <span lang="ru" dir="ltr">Русский</span>
      <span lang="tg" dir="ltr">Тоҷикӣ</span>
      <span lang="uz" dir="ltr">Oʻzbekcha</span>
      <span lang="zh" dir="ltr">中文</span>
      <span lang="es" dir="ltr">Español</span>
      <span lang="fr" dir="ltr">Français</span>
      <span lang="tr" dir="ltr">Türkçe</span>
      <span lang="hi" dir="ltr">हिन्दी</span>
      <span lang="de" dir="ltr">Deutsch</span>
      <span class="more" data-i18n="lang.more"></span>
    </div>
  </section>

  <section id="pricing" class="wrap">
    <h2 data-i18n="price.title"></h2>
    <p class="sub" data-i18n="price.sub"></p>
    <div class="plans">
      <div class="plan"><h3 data-i18n="price.free.n"></h3><div class="amt">$0</div><p class="pm" data-i18n="price.free.m"></p><p data-i18n="price.free.d"></p><a class="btn small" href="/login" data-i18n="price.cta.free"></a></div>
      <div class="plan"><h3 data-i18n="price.s.n"></h3><div class="amt"><s>$9</s> $4.50<small data-i18n="price.mo"></small></div><p class="disc" data-i18n="price.off.s"></p><p class="pm" data-i18n="price.s.m"></p><p data-i18n="price.s.d"></p><a class="btn small" href="/app?plan=starter" data-i18n="price.cta.buy"></a></div>
      <div class="plan hot"><span class="pop" data-i18n="price.pop"></span><h3 data-i18n="price.c.n"></h3><div class="amt"><s>$29</s> $16.99<small data-i18n="price.mo"></small></div><p class="disc" data-i18n="price.off.c"></p><p class="pm" data-i18n="price.c.m"></p><p data-i18n="price.c.d"></p><a class="btn small" href="/app?plan=creator" data-i18n="price.cta.buy"></a></div>
      <div class="plan"><h3 data-i18n="price.p.n"></h3><div class="amt"><s>$79</s> $49.99<small data-i18n="price.mo"></small></div><p class="disc" data-i18n="price.off.p"></p><p class="pm" data-i18n="price.p.m"></p><p data-i18n="price.p.d"></p><a class="btn small" href="/app?plan=pro" data-i18n="price.cta.buy"></a></div>
      <div class="plan"><h3 data-i18n="price.b.n"></h3><div class="amt">$499<small data-i18n="price.mo"></small></div><p class="pm" data-i18n="price.b.m"></p><p data-i18n="price.b.d"></p><a class="btn small" href="/app?plan=business" data-i18n="price.cta.buy"></a></div>
      <div class="plan"><h3 data-i18n="price.x.n"></h3><div class="amt" data-i18n="price.x.big"></div><p class="pm" data-i18n="price.x.m"></p><p data-i18n="price.x.d"></p><a id="salesBtn" class="btn small ghost" href="mailto:sales@suvoz.io" data-i18n="price.cta.sales"></a></div>
    </div>
    <p class="pnote" data-i18n="price.note"></p>
  </section>

  <section id="faq" class="wrap">
    <h2 data-i18n="faq.title"></h2>
    <div class="faq">
      <details><summary data-i18n="faq.1.q"></summary><p data-i18n="faq.1.a"></p></details>
      <details><summary data-i18n="faq.2.q"></summary><p data-i18n="faq.2.a"></p></details>
      <details><summary data-i18n="faq.3.q"></summary><p data-i18n="faq.3.a"></p></details>
      <details><summary data-i18n="faq.4.q"></summary><p data-i18n="faq.4.a"></p></details>
    </div>
  </section>

  <div class="wrap">
    <div class="final">
      <h2 data-i18n="final.title"></h2>
      <a class="btn" href="/app" data-i18n="final.cta"></a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> <span data-brand>Suvoz</span>. <span data-i18n="foot.rights"></span> HORIZON GATE COMMERCE FZE LLC, Ajman, UAE.</span>
    <span class="flinks"><a href="/terms">Terms</a> <a href="/privacy">Privacy</a> <a href="/refunds">Refunds</a></span>
  </div>
</footer>

<dialog id="salesDlg" class="sdlg"><h3 data-i18n="sales.title"></h3><p id="sSub" data-i18n="sales.sub"></p>
<form id="salesForm" novalidate>
<input name="name" maxlength="120" autocomplete="name" data-i18n-ph="sales.name" required>
<input name="email" type="email" maxlength="200" autocomplete="email" data-i18n-ph="sales.email" required>
<textarea name="message" rows="4" maxlength="4000" data-i18n-ph="sales.msg" required></textarea>
<input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="btn" type="submit" id="sSend" data-i18n="sales.send"></button>
<p class="serr" id="sErr" hidden></p>
</form>
<div id="sDone" hidden><p class="sthanks" data-i18n="sales.thanks"></p></div>
<button type="button" class="linkbtn" id="sClose" data-i18n="sales.close"></button></dialog>
<script>
(function(){var d=document.getElementById('salesDlg'),b=document.getElementById('salesBtn');if(!d||!b)return;
var sub=document.getElementById('sSub'),f=document.getElementById('salesForm'),done=document.getElementById('sDone'),err=document.getElementById('sErr'),send=document.getElementById('sSend');
function tr(k){try{return t(k);}catch(x){return '';}}
b.addEventListener('click',function(e){if(d.showModal){e.preventDefault();f.hidden=false;sub.hidden=false;done.hidden=true;err.hidden=true;d.showModal();}});
document.getElementById('sClose').onclick=function(){d.close();};
d.addEventListener('click',function(e){if(e.target===d)d.close();});
f.addEventListener('submit',function(e){e.preventDefault();err.hidden=true;
var v={name:f.name.value.trim(),email:f.email.value.trim(),message:f.message.value.trim(),website:f.website.value};
if(!v.name||!v.message||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)){err.textContent=tr('sales.bad');err.hidden=false;return;}
send.disabled=true;
fetch('/api/sales',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)}).then(function(r){
if(!r.ok)throw new Error(r.status);f.hidden=true;sub.hidden=true;done.hidden=false;f.reset();}).catch(function(){err.textContent=tr('sales.fail');err.hidden=false;}).then(function(){send.disabled=false;});});})();
</script>
<script src="/i18n.js"></script>
<script src="/i18n-auth.js"></script>
<script src="/i18n-pricing.js"></script>
<script src="/site.js"></script>
</body>
</html>

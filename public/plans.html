<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suvoz – Plans</title>
<script>(function(){try{var d=document.documentElement,l=localStorage.getItem("lang");if(l&&/^(en|ar|ru|tg|uz)$/.test(l)){d.lang=l;d.dir=l==="ar"?"rtl":"ltr"}var s=JSON.parse(localStorage.getItem("suvoz_session")||"null");d.className+=(s&&s.access_token?" in pre":" out")}catch(e){}})()</script>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Suvoz">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3b3fe0"/><g stroke-linecap="round" stroke-width="3.2"><path d="M9 13v6" stroke="#fff"/><path d="M14.5 8v16" stroke="#fff"/><path d="M20 11v10" stroke="#7fe3dd"/><path d="M25 14.5v3" stroke="#7fe3dd"/></g></svg>
      <span data-brand>Suvoz</span>
    </a>
    <div class="top-right">
      <span id="who" class="who-mail" dir="ltr" hidden></span>
      <a class="pbtn" href="/app" data-i18n="nav.tools"></a>
      <button id="logout" class="pbtn" type="button" hidden data-i18n="app.logout"></button>
    </div>
  </div>
</header>

<main class="wrap plans-page">
  <h1 data-i18n="pl.title"></h1>
  <p class="lead" data-i18n="pl.sub"></p>
  <div id="curCard" class="cur-card" hidden></div>
  <p id="msg" class="amsg" role="status"></p>
  <div id="grid" class="plans"></div>
  <p class="pnote" id="note" hidden data-i18n="pl.note"></p>
  <p class="pnote" data-i18n="price.note"></p>
</main>

<dialog id="dlg" class="sdlg"><h3 id="dT"></h3><p id="dD"></p>
<div class="dbtns"><button type="button" class="btn ghost" id="dNo" data-i18n="pl.c.no"></button><button type="button" class="btn" id="dYes" data-i18n="pl.c.yes"></button></div></dialog>

<script src="/i18n.js"></script>
<script src="/i18n-auth.js"></script>
<script src="/i18n-pricing.js"></script>
<script src="/i18n-plans.js"></script>
<script src="/i18n-hub.js"></script>
<script src="/auth.js"></script>
<script src="/profile.js"></script>
<script src="/plans.js"></script>
</body>
</html>
